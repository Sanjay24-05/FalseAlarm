[project]
name = "false-alarm"
version = "0.1.0"
description = "False Alarm SIEM investigation backend"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115.0",
    "httpx>=0.27.0",
    "pydantic>=2.0",
    "python-multipart>=0.0.9",
    "uvicorn>=0.32.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2.0",
]

[project.scripts]
false-alarm = "false_alarm.main:run"

[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
include = ["false_alarm*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
